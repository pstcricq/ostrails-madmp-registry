# Quality control of every DMP this registry holds.
#
# The check itself lives in madmp-core, which owns the rules and the engine.
# This file only says which documents to run it on, and it finds them rather
# than naming them: a project's folder is laid out by madmp-core and its DMP
# is written by the submission webhook, so nobody edits this file when a
# project arrives. Naming them here would mean a new project is silently not
# checked, which is worse than not checking at all.
#
# The version of madmp-core is pinned. Following its default branch would
# turn a DMP red for a change made there, long after the document was
# written, and nobody could fix it from this repository.
name: Quality control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which documents are here, as a matrix the check below fans out over. A
  # DMP is `dmp_<project>_template.json`, and the versions it was built from
  # sit beside it under the same name with `.meta.json`, both written by the
  # same commit.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          matrix=$(find projects -name 'dmp_*_template.json' | sort | python3 -c "
          import json, sys
          include = [
              {
                  'project': path.split('/')[1],
                  'dmp': path,
                  'pins': path[: -len('.json')] + '.meta.json',
              }
              for path in (line.strip() for line in sys.stdin)
              if path
          ]
          print(json.dumps({'include': include}))
          ")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "found=$(echo "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # One check per document, each naming its project in the check list, so a
  # red one says which. An empty registry skips this rather than failing on a
  # matrix with no values.
  quality-control:
    needs: discover
    if: needs.discover.outputs.found != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: quality-control (${{ matrix.project }})
    # Still the old file name, and deliberately: this is fetched at v0.1.2,
    # where the file is there under the name it had then. Renaming it here
    # before the tag that carries the new name would break every submission.
    uses: pstcricq/ostrails-madmp-core/.github/workflows/qc-dmp.yml@v0.1.2
    with:
      dmp_path: ${{ matrix.dmp }}
      pins_path: ${{ matrix.pins }}
    secrets:
      # madmp-core is private, and a called workflow runs with this
      # repository's own token, which cannot read it.
      madmp_core_token: ${{ secrets.MADMP_CORE_TOKEN }}

  # A submission that passes is merged here, by a job, because there is no
  # branch protection on this repository: private, on a plan that does not
  # offer it. What that costs is named rather than hidden. A rule would stop
  # anyone pushing to `main`, this only stops a red submission landing, and
  # that is the risk actually worth covering, the webhook being the only
  # writer here and writing only through a pull request.
  #
  # It waits on every check and not only the submitted project's, because a
  # red DMP on `main` is a state this gate exists to make impossible. The day
  # one is there anyway, no submission merges until it is dealt with, which is
  # the right way round.
  #
  # Squashed: one submission, one commit on `main`, whatever the review took.
  merge:
    needs: quality-control
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'submission/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `needs` already means the check passed, a failed one never reaches
      # here. The condition above is about which pull requests this job may
      # merge at all, and it is the whole of that answer: a branch this
      # repository's own webhook opened, and nothing else.
      - name: Merge the submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
